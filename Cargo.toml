[workspace]
members = ["crates/xadbtest-protocol", "crates/xadbtest", "crates/xadbtest-fixture-worker", "crates/foundation", "crates/platform", "crates/xadbtest-foundation-worker", "crates/xadbtest-reference", "crates/engine", "crates/xadbtest-engine-worker"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
nix = { version = "=0.30.1", features = ["signal", "process", "fs"] }
xadbtest-protocol = { path = "crates/xadbtest-protocol" }
xadb-foundation = { path = "crates/foundation" }
xadb-platform = { path = "crates/platform" }
xadb-engine = { path = "crates/engine" }

[workspace.lints.rust]
unsafe_code = "forbid"
