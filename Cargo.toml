[workspace]
members = ["crates/testing/protocol", "crates/testing/controller", "crates/testing/fixture-worker", "crates/foundation", "crates/platform", "crates/testing/foundation-worker", "crates/testing/reference", "crates/engine", "crates/testing/engine-worker", "crates/transport", "crates/testing/transport-worker", "crates/sql"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tempfile = "=3.23.0"
nix = { version = "=0.30.1", features = ["signal", "process", "fs"] }
test_protocol = { package = "xadbtest-protocol", path = "crates/testing/protocol" }
foundation = { package = "xadb-foundation", path = "crates/foundation" }
platform = { package = "xadb-platform", path = "crates/platform" }
engine = { package = "xadb-engine", path = "crates/engine" }
transport = { package = "xadb-transport", path = "crates/transport" }

[workspace.lints.rust]
unsafe_code = "forbid"
