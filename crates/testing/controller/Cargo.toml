[package]
name = "xadbtest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
self-test = []

[lib]
name = "test_controller"

[dependencies]
test_protocol.workspace = true
test_reference = { package = "xadbtest-reference", path = "../reference" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
nix.workspace = true

[build-dependencies]
sha2.workspace = true

[[bin]]
name = "xadbtest"
path = "src/main.rs"

[[bin]]
name = "xadbtest-mutant-worker"
path = "tests/fixtures/mutant.rs"
required-features = ["self-test"]

[[test]]
name = "controller"
required-features = ["self-test"]

[[bin]]
name = "xadbtest-native-mutant-worker"
path = "tests/fixtures/native_mutant.rs"
required-features = ["self-test"]

[[test]]
name = "native"
required-features = ["self-test"]

[[test]]
name = "performance_gate"
required-features = ["self-test"]

[lints]
workspace = true
