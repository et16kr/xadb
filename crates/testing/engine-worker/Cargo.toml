[package]
name = "xadbtest-engine-worker"
default-run = "xadbtest-engine-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "engine_worker"

[dependencies]
serde_json.workspace = true
engine.workspace = true
foundation.workspace = true
platform.workspace = true
test_protocol.workspace = true

[build-dependencies]
sha2.workspace = true

[dev-dependencies]
engine = { workspace = true, features = ["test-support"] }
test_controller = { package = "xadbtest", path = "../controller" }
tempfile.workspace = true

[lints]
workspace = true

[[bin]]
name = "xadbtest-durable-worker"
path = "src/bin/durable.rs"

[[bin]]
name = "xadbtest-durable-performance-worker"
path = "src/bin/durable_performance.rs"
