name: Development quick check
on:
  push:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock
      - rust-toolchain.toml
      - '.cargo/**'
      - .github/workflows/dev0.yml
  pull_request:
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - Cargo.lock
      - rust-toolchain.toml
      - '.cargo/**'
      - .github/workflows/dev0.yml
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Install only the formatter needed here; do not build or run product tests.
      - name: Install the pinned formatter
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt
          echo "XADB_FORMAT_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
      - name: Check Rust formatting
        run: cargo +"$XADB_FORMAT_TOOLCHAIN" fmt --all --check
