name: DEV0 and DEV1
on: [push, pull_request]
permissions:
  contents: read
jobs:
  local-harness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install the repository toolchain
        run: rustup show
      - name: Verify DEV1 and DEV0 regression
        run: python3 scripts/check_dev1.py
      - name: Preserve evidence, including intentional negative cases
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-evidence
          path: artifacts/
          retention-days: 14
