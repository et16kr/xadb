# Trusted control half of the module gate (XADB-MODULE-GATE-003,
# devdoc/policies/repository-build-plan.md#module-gate). pull_request_target
# runs this file and the checker from the default branch; the pull request
# head is fetched as Git objects and read as data, never built or executed.
# The only write is a commit status on the head: `xadb/module-gate` (which
# the main ruleset requires) for a pull request into the default branch, and
# `xadb/module-gate-work` for one into a work branch, so a work-branch verdict
# on the same commit never satisfies the main ruleset. The protected test
# refs `gate-test/**` are judged like main (their verification PRs must not
# be reopened into main with the same head). No paths filter.
# Limit: a same-repository pull request's own workflow can also post a status
# named `xadb/module-gate` with the Actions app (integration 15368); only a
# GitHub App check run would close that (repository-build-plan.md#module-gate).
name: Module gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write
concurrency:
  group: module-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  final:
    name: module-gate-final
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    env:
      # A pull request into main, or into the protected test refs gate-test/**
      # (same ruleset), is judged as a merge and posts the required context;
      # a work-branch target keeps obligations pending and posts its own.
      XADB_CONTEXT: ${{ (github.event.pull_request.base.ref == github.event.repository.default_branch || startsWith(github.event.pull_request.base.ref, 'gate-test/')) && 'xadb/module-gate' || 'xadb/module-gate-work' }}
      XADB_MODE: ${{ (github.event.pull_request.base.ref == github.event.repository.default_branch || startsWith(github.event.pull_request.base.ref, 'gate-test/')) && 'merge' || 'push' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mark the head pending
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending
          -f context="$XADB_CONTEXT" -f description="judging" -f target_url="$RUN_URL"
      - name: Fetch the pull request head and base as data
        env:
          PR: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/$PR/head:refs/gate/head" "+refs/heads/$BASE_REF:refs/gate/base"
          git cat-file -e "$HEAD_SHA^{commit}"
          git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags origin "$BASE_SHA"
          echo "XADB_POLICY=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Judge boundary, review and evidence, then accept the build run
        id: judge
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 -B scripts/check_module_gate.py final --repo . --base "$BASE_SHA"
          --head "$HEAD_SHA" --policy "$XADB_POLICY" --mode "$XADB_MODE"
          --repository "$GITHUB_REPOSITORY" --build-workflow .github/workflows/module-build.yml
          --artifact module-build-receipt --wait 7500
          --out "$RUNNER_TEMP/module-gate-report.json"
      - name: Publish the verdict on the head
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          OUTCOME: ${{ steps.judge.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          report="$RUNNER_TEMP/module-gate-report.json"
          summary=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("summary", ""))' "$report" 2>/dev/null || true)
          if [ "$OUTCOME" = success ]; then state=success; else state=failure; fi
          text=$(printf '%s' "${summary:-outcome $OUTCOME}" | cut -c1-140)
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" \
            -f context="$XADB_CONTEXT" -f description="$text" -f target_url="$RUN_URL"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: module-gate-report
          path: ${{ runner.temp }}/module-gate-report.json
          if-no-files-found: warn
          retention-days: 30
